<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 90" width="440" height="90" role="img" aria-label="Digital Impression — Premium Webdesign">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&amp;family=Inter:wght@600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Wordmark — Digital in cream, Impression in gold (both strong on navy) -->
  <text x="220" y="50" text-anchor="middle" class="serif" font-size="46" font-weight="600">
    <tspan fill="#F7F2E7">Digital </tspan><tspan font-style="italic" fill="#C9A227">Impression</tspan>
  </text>

  <!-- Tagline — fine letterspaced sans caps, centered under the wordmark -->
  <text x="221.3" y="73" text-anchor="middle" class="sans" font-size="10.5" font-weight="600" letter-spacing="2.6" fill="#C9A227">PREMIUM WEBDESIGN</text>
</svg>

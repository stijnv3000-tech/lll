<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 510 132" width="510" height="132" role="img" aria-label="Digital Impression — Premium Webdesign België">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Monogram — detailed: navy fill, thin gold border, gold DI -->
  <rect x="8" y="18" width="96" height="96" rx="22" fill="#0F1B3C"/>
  <rect x="13.2" y="23.2" width="85.6" height="85.6" rx="17" fill="none" stroke="#C9A227" stroke-width="1.4"/>
  <text x="56.5" y="67" text-anchor="middle" dominant-baseline="central" class="serif"
        font-size="52" font-weight="600" letter-spacing="-2" fill="#C9A227">DI</text>

  <!-- Wordmark — one serif family: Digital upright, Impression italic -->
  <text x="128" y="69" class="serif" font-size="46" font-weight="600" textLength="362" lengthAdjust="spacing">
    <tspan fill="#0F1B3C">Digital </tspan><tspan font-style="italic" fill="#C9A227">Impression</tspan>
  </text>

  <!-- Tagline — letterspaced small caps, edges aligned to wordmark -->
  <text x="128" y="93" class="serif" font-size="12.5" font-weight="600" textLength="362" lengthAdjust="spacing" fill="#0F1B3C">PREMIUM WEBDESIGN · BELGIË</text>
</svg>

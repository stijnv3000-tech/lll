<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61" role="img" aria-label="Digital Impression visitekaart achterzijde">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@500;600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>
  <!-- full-bleed cream (3mm bleed; trim at 85×55mm) -->
  <rect width="91" height="61" fill="#F7F2E7"/>
  <rect x="5" y="5" width="81" height="51" rx="2.4" fill="none" stroke="#C9A227" stroke-width="0.3"/>

  <!-- SECTION 1: value hook + USPs -->
  <text x="45.5" y="14" text-anchor="middle" class="serif" font-size="5.3" font-weight="600"><tspan fill="#0E1B3C">Een website die </tspan><tspan fill="#C9A227">klanten</tspan><tspan fill="#0E1B3C"> oplevert.</tspan></text>

  <g class="sans" font-size="2.85" font-weight="500" fill="#0E1B3C">
    <path d="M18 17.7 l0.8 1.0 l1.7 -2.1" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="19.3">Professioneel design dat vertrouwen wekt</text>
    <path d="M18 22.7 l0.8 1.0 l1.7 -2.1" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="24.3">Mobielvriendelijk &amp; razendsnel</text>
    <path d="M18 27.7 l0.8 1.0 l1.7 -2.1" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="29.3">Beter vindbaar in Google</text>
  </g>

  <!-- section divider -->
  <line x1="16" y1="34" x2="75" y2="34" stroke="#C9A227" stroke-width="0.18"/>

  <!-- SECTION 2: contact (phone + email only) -->
  <text x="45.5" y="39.2" text-anchor="middle" class="sans" font-size="1.9" font-weight="600" letter-spacing="1.1" fill="#C9A227">CONTACT</text>
  <text x="45.5" y="45" text-anchor="middle" class="sans" font-size="3" font-weight="500" fill="#0E1B3C">+32 496 25 14 45</text>
  <text x="45.5" y="50.6" text-anchor="middle" class="sans" font-size="3" font-weight="500" fill="#0E1B3C">info@digital-impression.be</text>
</svg>

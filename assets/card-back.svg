<svg xmlns="http://www.w3.org/2000/svg" width="91mm" height="61mm" viewBox="0 0 91 61" role="img" aria-label="Digital Impression visitekaart achterzijde">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
      .sans  { font-family: 'Inter', Arial, sans-serif; }
    </style>
  </defs>
  <!-- full-bleed cream (3mm bleed; trim at 85×55mm) -->
  <rect width="91" height="61" fill="#F7F2E7"/>
  <rect x="5" y="5" width="81" height="51" rx="2.4" fill="none" stroke="#C9A227" stroke-width="0.3"/>

  <!-- value hook -->
  <text x="45.5" y="14.5" text-anchor="middle" class="serif" font-size="5.4" font-weight="600"><tspan fill="#0E1B3C">Een website die </tspan><tspan fill="#C9A227">klanten</tspan><tspan fill="#0E1B3C"> oplevert.</tspan></text>

  <!-- USPs -->
  <g class="sans" font-size="2.85" font-weight="500" fill="#0E1B3C">
    <path d="M18 22.6 l0.9 1.1 l1.9 -2.3" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="24.3">Professioneel design dat vertrouwen wekt</text>
    <path d="M18 28.1 l0.9 1.1 l1.9 -2.3" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="29.8">Mobielvriendelijk &amp; razendsnel</text>
    <path d="M18 33.6 l0.9 1.1 l1.9 -2.3" fill="none" stroke="#C9A227" stroke-width="0.55" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="35.3">Beter vindbaar in Google</text>
  </g>

  <line x1="33" y1="40" x2="58" y2="40" stroke="#C9A227" stroke-width="0.2"/>

  <!-- contact -->
  <g text-anchor="middle" class="sans">
    <text x="45.5" y="45.5" font-size="2.6" fill="#0E1B3C">Brabançonnestraat 32, 3000 Leuven</text>
    <text x="45.5" y="49.6" font-size="2.35" fill="#0E1B3C">+32 496 25 14 45   ·   info@digital-impression.be</text>
    <text x="45.5" y="53.8" font-size="2.7" font-weight="600" fill="#C9A227">www.digital-impression.be</text>
  </g>
</svg>
